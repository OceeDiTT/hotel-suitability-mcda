services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: hotel, POSTGRES_PASSWORD: hotel, POSTGRES_DB: hotel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro     # schema + views created on first start
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"], interval: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: Dockerfile}
    environment: {DATABASE_URL: "postgresql://hotel:hotel@db:5432/hotel"}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  etl:                                            # one-shot: docker compose run --rm etl
    build: {context: ., dockerfile: Dockerfile.etl}
    profiles: ["etl"]
    environment: {DATABASE_URL: "postgresql://hotel:hotel@db:5432/hotel"}
    volumes: ["./data:/app/data:ro"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
