# Free setup: Render free web service + an external free Postgres/PostGIS (e.g. Neon).
# DATABASE_URL is entered by hand in the Render dashboard (sync: false) - never commit it.
services:
  - type: web
    name: lisbon-hotel-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
